<!doctype html>
<html lang="en" class="h-full bg-gray-50">

<head>
  <!-- Template loader -->
  <script type="module" src="/js/ui.js"></script>

  <!-- Supabase MUST be loaded statically -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Prevent FOUC (flash of unstyled content) -->
  <link rel="stylesheet" href="/css/style.css">
</head>

<body class="h-full">

<div data-template="head"></div>
<div data-template="header"></div>

<main class="mx-auto grid min-h-[80vh] max-w-md place-items-center p-6">
  <div class="w-full rounded-lg border bg-white p-6 shadow-sm">

    <h1 class="mb-1 text-2xl font-semibold">Welcome back</h1>
    <p class="mb-6 text-sm text-gray-500">Sign in to manage your servers</p>

    <form id="login-form" class="space-y-4">

      <div>
        <label class="mb-2 block text-sm font-medium" for="email">Email</label>
        <input id="email" type="email" required
               class="block w-full rounded-lg border border-gray-300 p-2.5 text-sm focus:border-blue-600 focus:ring-blue-600">
      </div>

      <div>
        <label class="mb-2 block text-sm font-medium" for="password">Password</label>
        <input id="password" type="password" required
               class="block w-full rounded-lg border border-gray-300 p-2.5 text-sm focus:border-blue-600 focus:ring-blue-600">
      </div>

      <div id="login-error" class="text-sm text-red-600"></div>

      <button type="submit"
              class="w-full rounded-lg bg-blue-600 px-4 py-2.5 text-white hover:bg-blue-700">
        Sign in
      </button>

      <p class="mt-3 text-center text-sm text-gray-600">
        Need an account?
        <a href="/signup.html" class="text-blue-600 hover:underline">Sign up</a>
      </p>

    </form>
  </div>
</main>

<div data-template="footer"></div>

<script type="module" src="/js/login.js"></script>

</body>
</html>

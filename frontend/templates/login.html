{% extends "base.html" %}
{% block content %}

<div class="max-w-md mx-auto bg-white p-6 rounded-lg border shadow-sm">
    <h1 class="text-2xl font-semibold mb-4">Log in</h1>

    <form id="login-form" class="space-y-4">
        <div>
            <label class="text-sm font-medium" for="email">Email</label>
            <input id="email" type="email" required
                   class="mt-1 w-full border rounded-lg p-2.5">
        </div>

        <div>
            <label class="text-sm font-medium" for="password">Password</label>
            <input id="password" type="password" required
                   class="mt-1 w-full border rounded-lg p-2.5">
        </div>

        <div id="login-error" class="text-red-600 text-sm"></div>

        <button class="w-full bg-blue-600 text-white p-2.5 rounded-lg hover:bg-blue-700">
            Log in
        </button>
    </form>
</div>

<script type="module" src="/static/js/login.js"></script>

{% endblock %}

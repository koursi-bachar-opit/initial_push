<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title or "SuperVision Remote Servers" }}</title>

    <!--Tailwind and Flowbite-->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.1/flowbite.min.css" rel="stylesheet">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.1/flowbite.min.js"></script>

    <!--Supabase-->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!--Tailwind Dark Mode Setup-->
    <script>
        tailwind.config = {
            darkMode: 'class',
        };
    </script>
</head>

<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300">

<!--Navbar-->
<header class="border-b bg-white dark:bg-gray-800 dark:border-gray-700">
    <div class="mx-auto max-w-7xl flex items-center justify-between p-4">
        <a href="/" class="text-xl font-semibold text-gray-900 dark:text-white">SuperVision Remote Servers</a>

        <nav class="flex gap-5 text-sm items-center">

            <!--Always visible-->
            <a href="/listings" class="hover:text-gray-800 dark:hover:text-white">Listings</a>

            {% if not user %}
                <!--Anonymous user-->
                <a href="/login" class="text-gray-700 hover:text-gray-900 dark:text-gray-300 dark:hover:text-white">Log in</a>
                <a href="/signup"
                   class="rounded-lg bg-blue-600 px-4 py-1.5 text-white hover:bg-blue-700 transition">
                    Sign up
                </a>

            {% else %}

                {% if user.role == "buyer" %}
                    <a href="/bookings" class="hover:text-gray-800 dark:hover:text-white">Bookings</a>
                    <a href="/dashboard" class="hover:text-gray-800 dark:hover:text-white">Dashboard</a>
                {% elif user.role == "provider" %}
                    <a href="/bookings" class="hover:text-gray-800 dark:hover:text-white">Bookings</a>
                    <a href="/dashboard" class="hover:text-gray-800 dark:hover:text-white">Dashboard</a>
                {% endif %}

                <!--Client-side logout (wait Supabase and localStorage)-->
                <button onclick="logoutUser()"
                        class="text-red-600 hover:underline dark:text-red-400 dark:hover:text-red-300">
                    Log out
                </button>

            {% endif %}

            <button onclick="toggleTheme()" class="text-gray-600 dark:text-gray-300 hover:text-blue-600">
                🌓
            </button>


        </nav>
    </div>
</header>

<!--Main content-->
<main class="mx-auto max-w-7xl p-6">
    {% block content %}
    {% endblock %}
</main>

<!--Footer content-->
<footer class="py-8 text-center text-gray-500 text-sm dark:text-gray-400">
    Remote Servers Marketplace — MVP v0.3
</footer>

<!--Load shared Supabase client-->
<script type="module" src="/static/js/supabaseClient.js"></script>

<script>
    //Logs out client-side Supabase session
    function logoutUser() {
        localStorage.removeItem("access_token");
        localStorage.removeItem("user_role");
        window.location.href = "/logout";
    }
</script>

<script>
    //Apply saved theme on page load
    const userTheme = localStorage.getItem('theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    //if (userTheme === 'dark' || (!userTheme && systemPrefersDark)) {  //Pervasive dark mode
    if (userTheme === 'dark') {
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark');
    }

    //Toggle handler
    function toggleTheme() {
        const html = document.documentElement;
        const isDark = html.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }
</script>


</body>
</html>

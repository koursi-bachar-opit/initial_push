<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title or "SuperVision Remote Servers" }}</title>

    <!--Apply saved theme before rendering to avoid flash-->
    <script>
        //Apply saved theme on page load
        const userTheme = localStorage.getItem('theme');
        if (userTheme === 'dark') {     //if (userTheme === 'dark' || (!userTheme && systemPrefersDark)) {  //Pervasive dark mode
            document.documentElement.classList.add('dark');
        }
    </script>

    <!--Tailwind and Flowbite-->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.1/flowbite.min.css" rel="stylesheet">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.1/flowbite.min.js"></script>

    <!--Supabase-->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!--Tailwind Dark Mode Setup-->
    <script>
        tailwind.config = {
            darkMode: 'class',
        };
    </script>
</head>

<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300">

<!--Navbar-->
<header class="border-b bg-white dark:bg-gray-800 dark:border-gray-700">
    <div class="mx-auto max-w-7xl flex items-center justify-between p-4">
        <a href="/" class="text-xl font-semibold text-gray-900 dark:text-white">SuperVision Remote Servers</a>

        <nav class="flex gap-5 text-sm items-center">

            <!--Always visible-->
            <a href="/listings" class="hover:text-gray-800 dark:hover:text-white">Listings</a>

            <!--Dynamic auth links - will be updated by JavaScript -->
            <div id="auth-links" class="flex gap-5 items-center">
                <!--Anonymous user links (default)-->
                <a href="/login" class="text-gray-700 hover:text-gray-900 dark:text-gray-300 dark:hover:text-white">Log in</a>
                <a href="/signup"
                   class="rounded-lg bg-blue-600 px-4 py-1.5 text-white hover:bg-blue-700 transition">
                    Sign up
                </a>
            </div>

            <div id="user-links" class="flex gap-5 items-center hidden">
                <!--Authenticated user links (hidden by default)-->
                <a href="/bookings" class="hover:text-gray-800 dark:hover:text-white">Bookings</a>
                <a href="/dashboard" class="hover:text-gray-800 dark:hover:text-white">Dashboard</a>
                
                <!--Client-side logout (wait Supabase and localStorage)-->
                <button onclick="logoutUser()"
                        class="text-red-600 hover:underline dark:text-red-400 dark:hover:text-red-300">
                    Log out
                </button>
            </div>

            <button onclick="toggleTheme()" class="text-gray-600 dark:text-gray-300 hover:text-blue-600">
                🌓
            </button>

        </nav>
    </div>
</header>

<!--Main content-->
<main class="mx-auto max-w-7xl p-6">
    {% block content %}
    {% endblock %}
</main>

<!--Footer content-->
<footer class="py-8 text-center text-gray-500 text-sm dark:text-gray-400">
    Remote Servers Marketplace — MVP v0.3
</footer>

<!--Load shared Supabase client-->
<script type="module" src="/static/js/supabaseClient.js"></script>

<script>
    // Check auth state on page load and update navbar
    function updateNavbar() {
        const token = localStorage.getItem("access_token");
        const userRole = localStorage.getItem("user_role");
        
        const authLinks = document.getElementById('auth-links');
        const userLinks = document.getElementById('user-links');
        
        if (token && userRole) {
            // User is logged in
            if (authLinks) authLinks.classList.add('hidden');
            if (userLinks) userLinks.classList.remove('hidden');
            
            // Update role-specific links if needed
            const bookingsLink = userLinks.querySelector('a[href="/bookings"]');
            const dashboardLink = userLinks.querySelector('a[href="/dashboard"]');
            
            // You can customize links based on role if needed
            // Example: if (userRole === 'admin') { ... }
            
        } else {
            // User is not logged in
            if (authLinks) authLinks.classList.remove('hidden');
            if (userLinks) userLinks.classList.add('hidden');
        }
    }
    
    // Run on page load
    document.addEventListener('DOMContentLoaded', updateNavbar);
    
    // Also run when localStorage changes (in case of login from another tab)
    window.addEventListener('storage', updateNavbar);
</script>

<script>
    //Logs out client-side Supabase session
    function logoutUser() {
        localStorage.removeItem("access_token");
        localStorage.removeItem("user_role");
        window.location.href = "/logout";
    }
</script>

<script>
    //Apply saved theme on page load

    //Toggle handler
    function toggleTheme() {
        const html = document.documentElement;
        const isDark = html.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }
</script>

</body>
</html>

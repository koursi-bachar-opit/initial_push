{% extends "base.html" %}
{% block content %}

<h1 class="text-3xl font-bold mb-6 text-gray-900 dark:text-white">Listings</h1>

<!-- Search Box -->
<div class="mb-8">
    <div class="flex gap-2">
        <div class="relative flex-1">
            <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"/>
                </svg>
            </div>
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Search listings by title..."
                class="block w-full p-4 ps-10 text-sm text-gray-900 border border-gray-300 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
            >
        </div>
        <button 
            id="searchButton"
            class="px-6 py-4 text-sm font-medium text-white bg-blue-700 rounded-lg hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800 transition"
        >
            Search
        </button>
        <button 
            id="clearSearch"
            class="px-6 py-4 text-sm font-medium text-gray-900 bg-white border border-gray-300 rounded-lg hover:bg-gray-100 focus:ring-4 focus:outline-none focus:ring-gray-200 dark:bg-gray-800 dark:text-white dark:border-gray-600 dark:hover:bg-gray-700 dark:hover:border-gray-700 dark:focus:ring-gray-700 transition"
        >
            Clear
        </button>
    </div>
    <div id="searchResultsInfo" class="mt-2 text-sm text-gray-600 dark:text-gray-400 hidden">
        Found <span id="resultsCount" class="font-semibold">0</span> results
    </div>
</div>

<!--Tabs-->
<div class="mb-6 border-b border-gray-200 dark:border-gray-700">
    <ul class="flex flex-wrap -mb-px text-sm font-medium text-center text-gray-500 dark:text-gray-400"
        id="listingTabs" role="tablist">
        <li class="mr-2">
            <button class="inline-block p-4 border-b-2 rounded-t-lg text-gray-600 dark:text-gray-300 hover:text-gray-800 dark:hover:text-white border-transparent hover:border-blue-600 dark:hover:border-blue-500 transition"
                    id="all-listings-tab"
                    data-tabs-target="#all-listings"
                    type="button"
                    role="tab"
                    aria-controls="all-listings"
                    aria-selected="true">
                All Listings
            </button>
        </li>

        {% if user %}
        <li class="mr-2">
            <button class="inline-block p-4 border-b-2 rounded-t-lg text-gray-600 dark:text-gray-300 hover:text-gray-800 dark:hover:text-white border-transparent hover:border-blue-600 dark:hover:border-blue-500 transition"
                    id="my-listings-tab"
                    data-tabs-target="#my-listings"
                    type="button"
                    role="tab"
                    aria-controls="my-listings"
                    aria-selected="false">
                My Listings
            </button>
        </li>
        {% endif %}
    </ul>
</div>

<!--All Listings-->
<div id="all-listings" role="tabpanel" aria-labelledby="all-listings-tab">
    <div id="listingsGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Listings will be loaded here via JS -->
    </div>
    <div id="noResults" class="hidden text-center py-12">
        <p class="text-gray-500 dark:text-gray-400 text-lg">No listings found.</p>
    </div>
</div>

<!--My Listings-->
{% if user %}
<div id="my-listings" class="hidden" role="tabpanel" aria-labelledby="my-listings-tab">
    <div id="myListingsGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- My listings will be loaded here -->
    </div>
    <div id="noMyResults" class="hidden text-center py-12">
        <p class="text-gray-500 dark:text-gray-400 text-lg">You haven't created any listings yet.</p>
    </div>
</div>
{% endif %}

<!--Detail Modal-->
<div id="listingDetailsModal" tabindex="-1" aria-hidden="true"
     class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 
     justify-center items-center w-full md:inset-0 h-modal md:h-full">

    <div class="relative p-4 w-full max-w-lg h-full md:h-auto">
        <div class="relative bg-white dark:bg-gray-800 rounded-lg shadow border border-gray-200 dark:border-gray-700">
            
            <!--Modal Header-->
            <div class="flex items-center justify-between p-4 border-b border-gray-200 dark:border-gray-700">
                <h3 id="modalTitle" class="text-xl font-semibold text-gray-900 dark:text-white"></h3>
                <button type="button"
                        class="text-gray-400 hover:text-gray-900 dark:hover:text-white rounded-lg text-sm p-1.5"
                        data-modal-hide="listingDetailsModal">
                    X
                </button>
            </div>

            <!--Modal Body-->
            <div class="p-4 space-y-3">
                <p id="modalDescription" class="text-gray-700 dark:text-gray-300"></p>

                <div class="flex items-center gap-2">
                    <span class="font-medium text-gray-800 dark:text-gray-200">Price:</span>
                    <span id="modalPrice" class="text-blue-600 dark:text-blue-400 font-semibold"></span>
                </div>

                <div id="modalMeta" class="text-sm text-gray-500 dark:text-gray-400"></div>
            </div>

            <!--Modal Footer-->
            <div class="flex justify-end p-4 border-t border-gray-200 dark:border-gray-700">
                <button data-modal-hide="listingDetailsModal"
                        class="mr-2 px-4 py-2 bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-200 rounded hover:bg-gray-200 dark:hover:bg-gray-600 transition">
                    Close
                </button>

                {% if user and user.role == "buyer" %}
                <button id="modalBookButton"
                        class="px-4 py-2 rounded bg-blue-600 text-white hover:bg-blue-700 transition">
                    Request Booking
                </button>
                {% endif %}
            </div>
        </div>
    </div>
</div>

<script type="module" src="/static/js/listings.js"></script>
{% endblock %}

<!doctype html>
<html lang="en" class="h-full bg-gray-50">

<div data-template="head"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.1/flowbite.min.js"></script>

<body class="h-full">

<div data-template="header"></div>

<main class="mx-auto max-w-7xl p-6">
  <!-- TESTING ACCOUNT CREATED BANNER -->
  <div id="signup-banner" 
      class="hidden mb-4 rounded-lg bg-green-100 text-green-800 px-4 py-3 text-sm border border-green-200">
    Account created successfully!
  </div>
  <!-- TESTING ACCOUNT CREATED BANNER -->
  <section class="rounded-2xl border bg-white p-8 text-center shadow-sm">
    <h1 class="mb-3 text-3xl font-semibold">Rent remote servers in seconds</h1>
    <p class="mx-auto mb-6 max-w-2xl text-gray-600">
      Browse GPU/CPU instances from providers, book hourly, and track usage.
    </p>

    <div class="flex justify-center gap-3">
      <a href="/listings.html" class="rounded-lg bg-blue-600 px-5 py-2.5 text-white hover:bg-blue-700">Browse listings</a>
      <a href="/bookings.html" class="rounded-lg border px-5 py-2.5 hover:bg-gray-50">Your bookings</a>
    </div>
  </section>
</main>

<div data-template="footer"></div>

<script type="module" src="/js/ui.js"></script>

<!-- SHOW SIGNUP SUCCESS BANNER -->
<script>
  const params = new URLSearchParams(window.location.search);
  if (params.get("signup_success")) {
    const banner = document.getElementById("signup-banner");
    if (banner) banner.classList.remove("hidden");
  }
</script>
<!-- SHOW SIGNUP SUCCESS BANNER -->

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Marketplace</title>
   !-- Tailwind + Flowbite Free via CDN --
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/flowbite@1.6.5/dist/flowbite.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-50">

  <header class="bg-white shadow">
    <div class="max-w-7xl mx-auto p-4 flex justify-between items-center">
      <h1 class="text-xl font-bold text-blue-600">Server Marketplace</h1>
      <nav>
        <a href="api/v1/listings" class="text-gray-700 hover:text-blue-600">Listings</a>
        <a href="api/v1/bookings" class="ml-4 text-gray-700 hover:text-blue-600">Bookings</a>
      </nav>
    </div>
  </header>

  <main id="main-content" class="p-8">
    <h2 class="text-2xl font-semibold mb-4">Welcome</h2>
    <p>Select a page to browse servers or manage bookings.</p>
  </main>

  <script src="https://unpkg.com/flowbite@1.6.5/dist/flowbite.min.js"></script>
</body>
</html>

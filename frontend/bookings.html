<!doctype html>
<html lang="en" class="h-full bg-gray-50">

<div data-template="head"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.1/flowbite.min.js"></script>

<body class="h-full">

<div data-template="header"></div>

<main class="mx-auto max-w-7xl p-6">
  <h1 class="mb-4 text-2xl font-semibold">Your bookings</h1>

  <div class="relative overflow-x-auto rounded-lg border bg-white">
    <table class="w-full text-left text-sm">
      <thead class="bg-gray-50 text-xs uppercase text-gray-500">
        <tr>
          <th class="px-6 py-3">Server</th>
          <th class="px-6 py-3">Buyer</th>
          <th class="px-6 py-3">Start</th>
          <th class="px-6 py-3">End</th>
          <th class="px-6 py-3">Status</th>
          <th class="px-6 py-3 text-right">Actions</th>
        </tr>
      </thead>
      <tbody id="bookings-body"></tbody>
    </table>
  </div>
</main>

<!-- Cancel modal -->
<div id="cancel-modal" tabindex="-1" aria-hidden="true"
     class="fixed inset-0 z-50 hidden place-items-center bg-black/40 p-4">
  <div class="w-full max-w-md rounded-lg bg-white p-6">
    <h3 class="mb-2 text-lg font-semibold">Cancel booking?</h3>
    <p class="mb-4 text-sm text-gray-600">This will stop the session and end billing.</p>

    <div class="flex justify-end gap-2">
      <button data-modal-hide="cancel-modal" class="rounded-lg border px-4 py-2">Keep</button>
      <button id="confirm-cancel" class="rounded-lg bg-red-600 px-4 py-2 text-white hover:bg-red-700">
        Confirm cancel
      </button>
    </div>
  </div>
</div>

<div data-template="footer"></div>

<script type="module" src="/js/ui.js"></script>
<script type="module" src="/js/bookings.js"></script>

</body>
</html>
